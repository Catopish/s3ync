[global]
state_dir = "/var/lib/s3ync"     # local state DB + status.json
log_level = "info"               # override with S3YNC_LOG=s3ync=debug
concurrency = 4                  # max parallel transfers across all jobs
rescan_interval_secs = 3600      # full re-check against S3; 0 = off
multipart_threshold_mb = 16
part_size_mb = 16                # >= 5
force_path_style = false         # true for MinIO / SeaweedFS / most S3-compatible stores

# Client-side encryption with age (https://age-encryption.org), off by default.
# Objects are encrypted before upload; synced files get a `.age` suffix, backups end in
# `.tar.zst.age`. Restore with `s3ync restore --job NAME --to DIR [-i PRIVATE_KEY]`.
# [encryption]
# type       = "age"
# recipients = [                   # public keys to encrypt to; list a spare key too
#   "~/.ssh/id_ed25519.pub",       # ssh-ed25519 / ssh-rsa public key file (~ = service user's home)
#   "age1...",                     # an age public key, e.g. from `s3ync keygen -o spare.key`
# ]
# identity   = "/etc/s3ync/age.key"  # private key for restore; with no recipients, data is
#                                    # encrypted to it. Create with `s3ync keygen`, then copy
#                                    # it OFF this machine: no key, no restore.

[[job]]
name    = "photos"               # unique key: [A-Za-z0-9_-]
mode    = "sync"
bucket  = "my-bucket"            # must already exist
source  = "/home/me/photos"      # absolute path
prefix  = "photos/"              # "dir" inside the bucket
delete  = false                  # also delete from S3 when deleted locally
exclude = ["*.tmp", "*.swp", ".git/", "**/node_modules/"]
debounce_ms = 3000
follow_symlinks = false
# encrypt = false                  # opt this job out of [encryption]

# Backup: packs `source` into s3://<bucket>/<prefix><name>.tar.zst.
# Taken by the daemon on `schedule`, or any time with `s3ync backup --job db-dumps`.
[[job]]
name    = "db-dumps"
mode    = "backup"
bucket  = "my-bucket"            # enable versioning: every run overwrites the same key
source  = "/var/backups/db"
prefix  = "backups/"
exclude = ["*.tmp"]
schedule = "0 2 * * *"           # cron, local time (TZ); omit to only run via `s3ync backup`
# No versioning (e.g. Cloudflare R2)? Keep timestamped copies instead:
# naming    = "timestamp"          # -> backups/db-dumps/db-dumps-<UTC time>.tar.zst
# keep_last = 14                   # older ones are deleted after each run; 0 = keep all
