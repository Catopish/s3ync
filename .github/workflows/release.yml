name: release

# Everything runs on version tags only: lint + tests, an end-to-end run against R2,
# a Docker build, static Linux binaries, and a GitHub release once all of them pass.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Tag matches Cargo.toml version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  e2e:
    runs-on: ubuntu-latest
    # One run at a time against the shared test bucket.
    concurrency: r2-e2e
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: End-to-end test against R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_TESTBUCKET_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_TESTBUCKET_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.R2_TEST_ENDPOINT }}
          AWS_REGION: auto
          S3YNC_TEST_BUCKET: ${{ secrets.CF_TESTBUCKET_NAME }}
          S3YNC_TEST_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
          S3YNC_BIN: target/release/s3ync
        run: tests/e2e.sh

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: s3ync:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker run --rm s3ync:ci --version

  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Smoke test
        run: |
          bin=target/${{ matrix.target }}/release/s3ync
          file "$bin" | tee /dev/stderr | grep -qE 'statically linked|static-pie linked'
          "$bin" --version
          "$bin" --help >/dev/null
      - name: Package
        run: |
          name=s3ync-$GITHUB_REF_NAME-${{ matrix.target }}
          mkdir "$name"
          cp target/${{ matrix.target }}/release/s3ync README.md LICENSE "$name/"
          cp -r dist "$name/dist"
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: s3ync-*.tar.gz*
          if-no-files-found: error

  release:
    needs: [check, e2e, docker, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          # Only the binaries: docker/build-push-action uploads its own build record too.
          pattern: "*-linux-musl"
          path: out
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tags like v0.2.0-rc.1 become pre-releases.
          pre=$([[ $GITHUB_REF_NAME == *-* ]] && echo --prerelease || true)
          gh release create "$GITHUB_REF_NAME" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag $pre
