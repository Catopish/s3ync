[package]
name = "s3ync"
version = "0.1.0"
edition = "2024"
description = "Daemon that syncs local directories to S3"
license = "GPL-3.0-only"
repository = "https://github.com/Catopish/s3ync"

[dependencies]
anyhow = "1.0.104"
aws-config = { version = "1.13.0", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1.155.0"
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive", "env"] }
dotenvy = "0.15.7"
futures-util = "0.3.34"
globset = "0.4.20"
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
redb = "4.4.0"
sd-notify = "0.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = "0.7.20"
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"
